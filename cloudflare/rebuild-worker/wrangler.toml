# ============================================================
# Cloudflare Worker —— 定时触发 Pages 重建
# ------------------------------------------------------------
# ⚠️ 注意：这个 wrangler.toml 是给 **Worker** 用的，不是给 Pages 用的。
#    Pages 的 Git 集成不读任何 wrangler.toml（构建参数在控制台配置），
#    本项目根目录也没有、也不需要 wrangler.toml。
#
# 部署：
#    cd cloudflare/rebuild-worker
#    npx wrangler deploy
#
# 配置密钥（必须，Deploy Hook URL 等同于密码）：
#    npx wrangler secret put DEPLOY_HOOK_URL
#    # 如需手动端点，再执行：
#    npx wrangler secret put REBUILD_TOKEN
# ============================================================

name = "zeizeijie-rebuild"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ------------------------------------------------------------
# Cron Trigger 时间表
# ------------------------------------------------------------
# ⚠️ Cron 按 **UTC** 执行，北京时间 = UTC + 8。
#
# 默认「每天 UTC 01:00」= 北京时间每天 09:00 重建一次。
# 每天 1 次 ≈ 30 次/月，远低于 Cloudflare Pages 免费版的构建额度，
# 对 Notion 这类低频内容源也足够。
#
# 常用写法（左侧为 UTC，已换算好北京时间，可直接替换）：
#   "0 1 * * *"      → 每天 北京时间 09:00
#   "0 13 * * *"     → 每天 北京时间 21:00
#   "0 1,13 * * *"   → 每天 北京时间 09:00 和 21:00（两次）
#   "0 1 * * MON"    → 每周一 北京时间 09:00
#   "*/30 * * * *"   → 每 30 分钟（⚠️ 约 1440 次/月，会超出免费额度，仅限按需临时使用）
#
# 字段格式：分 时 日 月 星期（星期 1=周日 … 7=周六，建议用 3 字母缩写避免歧义）
# 修改后需重新 deploy，且最多 15 分钟才会在全球网络生效。
# ------------------------------------------------------------
[triggers]
crons = ["0 1 * * *"]
